<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Bouncing Box</title>
  <script src="jquery.min.js"></script>
  <style>
    .box {
      width: 100px;
      height: 100px;

      
      /* background-image: url(https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9b/DVD_logo.svg/960px-DVD_logo.svg.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail);
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        background-blend-mode:screen;  */

      background-color: #fff;

      font-size: 170%;
      text-align: center;
      color: gray;
      user-select: none;
      display: block;
      position: absolute;
      top: 100px;
      /* Change me! */
      left: 100px;
    }

    .board {
      height: 100vh;
      background-color: navy;
    }
  </style>
  <!-- 	<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script> -->
</head>

<body class="board">
  <!-- HTML for the box -->
  <div class="box">?</div>

  <script>
    (function () {
      "use strict";
      /* global jQuery */

      //////////////////////////////////////////////////////////////////
      /////////////////// SETUP DO NOT DELETE //////////////////////////
      //////////////////////////////////////////////////////////////////

      var box = jQuery(".box"); // reference to the HTML .box element
      var board = jQuery(".board"); // reference to the HTML .board element
      var boardWidth = board.width(); // the maximum X-Coordinate of the screen
      var boardHeight = jQuery(window).height();

      // update the boardWidth variable when the window is resized
      jQuery(window).on("resize", function () {
        boardWidth = board.width();
      });

      // Every 50 milliseconds, call the update Function (see below)
      setInterval(update, 50);

      // Every time the box is clicked, call the handleBoxClick Function (see below)
      box.on("click", handleBoxClick);

      // moves the Box to a new position on the screen along the X-Axis
      function moveBoxTo(newPositionX, newPositionY) {
        box.css("left", newPositionX);
        box.css("top", newPositionY);
      }

      // changes the text displayed on the Box
      function changeBoxText(newText) {
        box.text(newText);
      }
      
  
      //////////////////////////////////////////////////////////////////
      /////////////////// YOUR CODE BELOW HERE /////////////////////////
      //////////////////////////////////////////////////////////////////

      // TODO 2 - Variable declarations
      var positionX = 0;
      var points = 0;
      var speed = 10;

      var positionY = 0;
      var speedY = 10;

      var colorStr;




      /**
       * This Function will be called 20 times/second.
       * Each time it is called, it should move the Box to a new location.
       * If the box drifts off the screen, turn it around!
       */

      function update() {
        positionX = positionX + speed;
        positionY = positionY + speedY;
        moveBoxTo(positionX, positionY);

        if (positionX > boardWidth) {
          speed *= -1;
        } else if (positionX < 0) {
          speed *= -1;
        }

        if (positionY > boardHeight) {
          speedY *= -1;
        } else if (positionY < 0) {
          speedY *= -1;
        }
      }

      

      function getRandomValue(randVal) {
        const minCeiled = Math.ceil(0);
        const maxFloored = Math.floor(255);
        var randVal = Math.floor(Math.random() * (maxFloored - minCeiled + 1) + minCeiled);
        return randVal;
      }


      // minmax 0-255 for values of rgb
      // use sample code: 
      // function getRandomIntInclusive(min, max) {
      // const minCeiled = Math.ceil(min);
      // const maxFloored = Math.floor(max);
      // return Math.floor(Math.random() * (maxFloored - minCeiled + 1) + minCeiled); // The maximum is inclusive and the minimum is inclusive } ?


      function getRandomColor() {
        // 3 diff values for color string rgb

        var valOne = getRandomValue(0, 255);
        var valTwo = getRandomValue(0, 255);
        var valThr = getRandomValue(0, 255);
        var colorStr = "rgb(" + valOne + ", " + valTwo + ", " + valThr + ")";
        // var colorStr = "rgb(50, 25, 250)";
        return colorStr;
        box.css("background-color", colorStr);
      }


      /**
       * This Function will be called each time the box is clicked.
       * Each time it is called, it should perform each of the following actions:
       * - increase the points total
       * - increase the speed
       * - move the box to the left side of the screen.
       */
      
      function handleBoxClick() {

        positionX = Math.floor(Math.random() * boardWidth);
        positionY = Math.floor(Math.random() * boardHeight);
        points++;

        // random change of direction

        var randValue = Math.floor(Math.random() * 10);

        if (randValue >= 5) {
          speed = (3 * points + 10) * -1;
        } else {
          speed = (3 * points + 10);
        }

        

        changeBoxText(points);
        getRandomColor();


      }



    })();
  </script>
</body>

</html>
